name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore csharp-practice.slnx

      - name: Build (no restore)
        run: dotnet build csharp-practice.slnx --configuration Release --no-restore

      - name: Test (no build)
        run: dotnet test csharp-practice.slnx --configuration Release --no-build --verbosity normal
